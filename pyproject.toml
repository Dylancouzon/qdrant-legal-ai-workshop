[project]
name = "fix-the-search"
version = "0.2.0"
description = "A legal retrieval agent workshop with Qdrant and LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "qdrant-client==1.15.1",
    "fastembed==0.7.3",
    "httpx==0.28.1",
    "pytest==8.4.1",
    "langgraph==1.2.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
